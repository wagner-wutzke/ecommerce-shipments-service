server:
  port: ${APP_PORT:9050}

spring:
  application.name: shipments-service
  datasource:
    url: jdbc:h2:file:./data/shipments-db
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
  h2.console.enabled: true
  sql.init.mode: always

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:shipments-service}
      properties.spring.json.trusted.packages: net.wowdev.ecommerce.domaain.events
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 0

app:
  kafka:
    shipments-topic: ${KAFKA_SHIPMENTS_TOPIC:shipments-topic}
    payments-topic: ${KAFKA_PAYMENTS_TOPIC:payments-topic.v1}
    orders-topic: ${KAFKA_ORDERS_TOPIC:orders-topic.v1}

logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO
    org.apache.kafka.common: ERROR
    org.apache.kafka.clients: ERROR
    net.wowdev.ecommerce.orders: DEBUG
    net.wowdev.ecommerce.customers: DEBUG
    net.wowdev.ecommerce.inventory: DEBUG
    net.wowdev.ecommerce.payments: DEBUG
    net.wowdev.ecommerce.shipments: DEBUG
    net.wowdev.ecommerce.datareplication: DEBUG
